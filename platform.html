<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carbon X - 交易市场</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles/platform.css" />
  </head>
  <body class="market-page">
    <div class="market-layout">
      <aside class="market-sidebar">
        <div class="sidebar-logo-wrap">
          <a href="index.html" class="sidebar-logo-link" aria-label="Carbon X 首页">
            <img src="assets/images/home/logo-carbonx.png" alt="Carbon X" />
          </a>
        </div>

        <div class="sidebar-profile">
          <img src="assets/images/cart/avatar.png" alt="用户头像" />
          <h2>碳小链</h2>
          <p>已认证 <span>✔</span></p>
        </div>

        <nav class="sidebar-nav">
          <a href="index.html"><img class="menu-icon-img" src="assets/images/rank/icon-home.png" alt="" />首页</a>
          <a class="active" href="platform.html"><img class="menu-icon-img" src="assets/images/rank/icon-market.png" alt="" />交易市场</a>
          <a href="cases.html"><img class="menu-icon-img" src="assets/images/rank/icon-rank.png" alt="" />排行榜</a>
          <a href="dashboard.html"><img class="menu-icon-img" src="assets/images/rank/icon-track.png" alt="" />足迹追踪</a>
          <a href="contact.html"><img class="menu-icon-img" src="assets/images/rank/icon-setting.png" alt="" />设置</a>
          <a href="cart.html"><img class="menu-icon-img" src="assets/images/rank/icon-cart.png" alt="" />购物车</a>
          <a href="news.html"><img class="menu-icon-img" src="assets/images/rank/icon-news.png" alt="" />新闻要点</a>
        </nav>
      </aside>

      <div class="market-main-wrap">
        <header class="market-topbar">
          <div class="topbar-left">
            <a class="toolbar-square grid-btn" href="index.html" aria-label="返回首页">
              <span></span><span></span><span></span>
              <span></span><span></span><span></span>
              <span></span><span></span><span></span>
            </a>

            <label class="top-search">
              <span class="search-lens"></span>
              <input id="marketGlobalSearch" type="search" placeholder="搜索" />
            </label>
          </div>

          <div class="topbar-right">
            <button class="toolbar-square icon-bag" type="button" aria-label="购物车"></button>
            <button class="toolbar-square icon-gear" type="button" aria-label="设置"></button>
            <button class="toolbar-square icon-bell" type="button" aria-label="通知"></button>
          </div>
        </header>

        <main class="market-body">
          <section class="market-center">
            <div class="market-filter-row">
              <label class="inline-search">
                <span class="search-lens"></span>
                <input id="marketInlineSearch" type="search" placeholder="搜索" />
              </label>

              <div class="sort-group">
                <span class="sort-label"><i></i> 排序：</span>
                <button class="sort-chip active" type="button" data-sort="all">全部</button>
                <button class="sort-chip" type="button" data-sort="low">最低</button>
                <button class="sort-chip" type="button" data-sort="high">最高</button>
                <button class="sort-chip" type="button" data-sort="hot">最热</button>
              </div>
            </div>

            <section class="market-block">
              <div class="block-head">
                <h2>精选企业</h2>
                <a href="cases.html">查看全部 <span>→</span></a>
              </div>

              <div class="creator-grid">
                <article class="creator-card">
                  <div class="creator-strip">
                    <img src="assets/images/market/featured-row-a.png" alt="精选企业组图A" />
                    <img class="creator-coin" src="assets/images/market/avatar-coin-a.png" alt="" />
                  </div>
                  <div class="creator-meta">
                    <div>
                      <h3>碳小链 <span>✔</span></h3>
                      <p>12.32 ICTC</p>
                    </div>
                    <button type="button" class="follow-btn">Follow</button>
                  </div>
                </article>

                <article class="creator-card">
                  <div class="creator-strip">
                    <img src="assets/images/market/featured-row-b.png" alt="精选企业组图B" />
                    <img class="creator-coin" src="assets/images/market/avatar-coin-b.png" alt="" />
                  </div>
                  <div class="creator-meta">
                    <div>
                      <h3>碳小链 <span>✔</span></h3>
                      <p>12.32 ICTC</p>
                    </div>
                    <button type="button" class="follow-btn">Follow</button>
                  </div>
                </article>

                <article class="creator-card">
                  <div class="creator-strip">
                    <img src="assets/images/market/featured-row-c.png" alt="精选企业组图C" />
                    <img class="creator-coin" src="assets/images/market/avatar-coin-c.png" alt="" />
                  </div>
                  <div class="creator-meta">
                    <div>
                      <h3>碳小链 <span>✔</span></h3>
                      <p>12.32 ICTC</p>
                    </div>
                    <button type="button" class="follow-btn">Follow</button>
                  </div>
                </article>
              </div>
            </section>

            <section class="market-block">
              <div class="block-head">
                <h2>精选商品</h2>
                <a href="cart.html">View All Creator <span>→</span></a>
              </div>
              <div id="marketProductGrid" class="product-grid"></div>
              <div class="market-bottom-row">
                <div id="marketPager" class="market-pager"></div>
                <p class="online-users">在线 <strong>474</strong> 用户</p>
              </div>
            </section>
          </section>

          <aside class="market-right">
            <section class="right-panel">
              <h3>搜索引擎</h3>
              <label class="right-search">
                <input id="marketSideSearch" type="search" placeholder="搜索" />
                <span class="search-lens"></span>
              </label>

              <div class="category-list">
                <button type="button" data-category="all" class="active"><span>全部</span><em>9951</em></button>
                <button type="button" data-category="建材"><span>建材</span><em>7854</em></button>
                <button type="button" data-category="生物制药"><span>生物制药</span><em>7854</em></button>
                <button type="button" data-category="化工"><span>化工</span><em>953</em></button>
              </div>
            </section>

            <section class="right-panel">
              <h3>Chains</h3>
              <label class="right-search">
                <input type="search" placeholder="搜索" />
                <span class="search-lens"></span>
              </label>

              <div class="chain-list">
                <button type="button" data-chain="all" class="active">
                  <span class="chain-icon all"></span>
                  <span><strong>All Chains</strong><small>ALL</small></span>
                </button>
                <button type="button" data-chain="CTC">
                  <span class="chain-icon ctc"></span>
                  <span><strong>Citcoin</strong><small>CTC</small></span>
                </button>
                <button type="button" data-chain="BTC">
                  <span class="chain-icon btc"></span>
                  <span><strong>Bitcoin</strong><small>BTC</small></span>
                </button>
                <button type="button" data-chain="MATIC">
                  <span class="chain-icon matic"></span>
                  <span><strong>Polygon</strong><small>MATIC</small></span>
                </button>
              </div>
            </section>

            <section class="right-panel price-panel">
              <h3>价格</h3>
              <div class="price-bars" aria-hidden="true">
                <span style="height: 12px"></span>
                <span style="height: 44px"></span>
                <span style="height: 54px"></span>
                <span style="height: 22px"></span>
                <span style="height: 26px"></span>
                <span style="height: 48px"></span>
                <span style="height: 34px"></span>
                <span style="height: 68px"></span>
                <span style="height: 96px"></span>
                <span style="height: 42px"></span>
                <span style="height: 58px"></span>
              </div>
              <div class="range-track" aria-hidden="true">
                <span class="dot a"></span>
                <span class="line"></span>
                <span class="dot b"></span>
              </div>
              <div class="price-values">
                <span>¥250</span>
                <span>¥870</span>
              </div>
            </section>
          </aside>
        </main>
      </div>
    </div>

    <p id="marketToast" class="market-toast" aria-live="polite"></p>

    <script src="assets/scripts/platform.js"></script>
  </body>
</html>
